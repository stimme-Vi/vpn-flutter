name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          flutter create temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Download Icon and Setup
        run: |
          curl -L -o icon.png "https://s.fotora.ru/4f904d818594a4f1.jpeg"
          sed -i 's/android:label="[^"]*"/android:label="StimmeVpn"/g' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StimmeVpn-APK
          path: build/app/outputs/flutter-apk/app-release.apk
